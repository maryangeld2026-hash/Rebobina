name: Compilar para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Probar el motor y el servicio en Windows
        run: python pruebas/prueba_motor.py

      - name: Probar el menú del clic derecho y el inicio automático
        run: python pruebas/prueba_windows.py

      - name: Crear Rebobina.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Rebobina --icon icono.ico
          --add-data "ui;ui"
          --collect-submodules watchdog
          app.py

      - name: Probar que el .exe arranca y responde
        shell: pwsh
        run: |
          $env:REBOBINA_DATOS = "$env:RUNNER_TEMP\rebobina-prueba"
          $p = Start-Process -FilePath dist\Rebobina.exe -ArgumentList "--navegador","--sin-abrir","--sin-servicio","--puerto=47300" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:47300/" -UseBasicParsing
          if ($r.Content -notmatch "Rebobina") { throw "El .exe no sirvió la interfaz" }
          Write-Host "El .exe arrancó y sirvió la interfaz ($($r.Content.Length) bytes)."
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Rebobina
          path: dist/Rebobina.exe

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rebobina v1.0.${{ github.run_number }}
          make_latest: true
          files: dist/Rebobina.exe
          body: |
            Rebobina para Windows 10 y 11.

            **Cómo empezar:** descarga `Rebobina.exe`, guárdalo donde quieras (por ejemplo en Documentos) y ábrelo.
            Empieza a vigilar Documentos y Escritorio, añade «Ver en el tiempo» al clic derecho y arranca sola al iniciar Windows.

            Windows SmartScreen puede avisar porque el programa no está firmado: elige «Más información › Ejecutar de todas formas».
